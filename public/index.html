/* =========================================================
   CIVICFIX — SAFE LIQUID GLASS UI
   UI ONLY: no application logic, DOM structure, or functions changed.
   ========================================================= */

:root{
  --cf-blue:#1769e0;
  --cf-blue-2:#2d83f6;
  --cf-ink:#142033;
  --cf-muted:#667085;
  --cf-bg:#f4f8ff;
  --cf-glass:rgba(255,255,255,.54);
  --cf-glass-strong:rgba(255,255,255,.68);
  --cf-glass-border:rgba(255,255,255,.88);
  --cf-glow:rgba(23,105,224,.16);
}

html{
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
  scroll-behavior:smooth;
}

body{
  min-width:0;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 8% 8%, rgba(61,145,255,.13), transparent 28%),
    radial-gradient(circle at 92% 16%, rgba(23,105,224,.10), transparent 26%),
    radial-gradient(circle at 50% 92%, rgba(83,164,255,.08), transparent 30%),
    var(--cf-bg);
}

/* Ambient glass lighting */
body::before,
body::after{
  content:"";
  position:fixed;
  pointer-events:none;
  z-index:-1;
  border-radius:50%;
  filter:blur(70px);
  opacity:.55;
}
body::before{
  width:260px;
  height:260px;
  left:-90px;
  top:18%;
  background:rgba(52,133,246,.16);
}
body::after{
  width:320px;
  height:320px;
  right:-120px;
  top:48%;
  background:rgba(23,105,224,.12);
}

/* Top glass layer */
.top{
  background:rgba(245,249,255,.42)!important;
  border-bottom:1px solid rgba(255,255,255,.75)!important;
  box-shadow:0 10px 35px rgba(31,91,176,.07);
  -webkit-backdrop-filter:blur(24px) saturate(170%);
  backdrop-filter:blur(24px) saturate(170%);
}

.topin{
  height:68px!important;
  border:1px solid rgba(255,255,255,.82);
  border-radius:22px;
  background:linear-gradient(135deg,rgba(255,255,255,.66),rgba(232,243,255,.40));
  box-shadow:
    0 16px 40px rgba(31,91,176,.10),
    inset 0 1px rgba(255,255,255,.9);
  -webkit-backdrop-filter:blur(28px) saturate(175%);
  backdrop-filter:blur(28px) saturate(175%);
}

.logo{
  border-radius:13px!important;
  box-shadow:0 8px 20px rgba(23,105,224,.22),inset 0 1px rgba(255,255,255,.35);
}

.nav button{
  border:1px solid transparent!important;
  transition:transform .28s cubic-bezier(.22,1,.36,1),
             background .28s ease,
             color .28s ease,
             box-shadow .28s ease;
}
.nav button:hover{
  transform:translateY(-1px);
  background:rgba(255,255,255,.38);
}
.nav button.active{
  background:rgba(220,235,255,.72)!important;
  border-color:rgba(255,255,255,.86)!important;
  box-shadow:0 6px 18px rgba(23,105,224,.10),inset 0 1px rgba(255,255,255,.9);
}

.ghost{
  transition:transform .25s ease,background .25s ease,box-shadow .25s ease;
}
.ghost:hover{
  transform:translateY(-1px);
  background:rgba(255,255,255,.48);
  box-shadow:0 7px 18px rgba(31,91,176,.08);
}

/* Glass hero */
.hero{
  position:relative;
  overflow:hidden;
  border-radius:30px!important;
  border:1px solid var(--cf-glass-border)!important;
  background:
    linear-gradient(135deg,rgba(255,255,255,.70),rgba(232,243,255,.43))!important;
  box-shadow:
    0 25px 65px rgba(31,91,176,.12),
    0 0 45px rgba(45,131,246,.07),
    inset 0 1px rgba(255,255,255,.96)!important;
  -webkit-backdrop-filter:blur(30px) saturate(175%);
  backdrop-filter:blur(30px) saturate(175%);
}

.hero::before{
  content:"";
  position:absolute;
  width:240px;
  height:240px;
  right:18%;
  top:-140px;
  border-radius:50%;
  background:rgba(65,145,255,.15);
  filter:blur(55px);
  pointer-events:none;
}

.hero h1,.title h1{
  letter-spacing:-.065em!important;
}

.eyebrow{
  letter-spacing:1.35px!important;
}

/* Glass surfaces */
.mapbox,
.card,
.stat,
.empty,
.support-card,
.authcard,
.modalcard{
  border:1px solid var(--cf-glass-border)!important;
  background:
    linear-gradient(135deg,rgba(255,255,255,.68),rgba(235,245,255,.42))!important;
  box-shadow:
    0 18px 45px rgba(31,91,176,.10),
    0 0 28px rgba(45,131,246,.045),
    inset 0 1px rgba(255,255,255,.95)!important;
  -webkit-backdrop-filter:blur(26px) saturate(165%);
  backdrop-filter:blur(26px) saturate(165%);
}

.mapbox{
  border-radius:25px!important;
}

.card,
.stat,
.empty,
.support-card{
  border-radius:24px!important;
  transition:
    transform .30s cubic-bezier(.22,1,.36,1),
    box-shadow .30s ease,
    border-color .30s ease;
}

.card:hover,
.stat:hover,
.support-card:hover{
  transform:translateY(-4px);
  border-color:rgba(255,255,255,.98)!important;
  box-shadow:
    0 24px 55px rgba(31,91,176,.14),
    0 0 28px rgba(45,131,246,.08),
    inset 0 1px rgba(255,255,255,1)!important;
}

/* Map glass header */
.maphead{
  background:rgba(255,255,255,.42)!important;
  border-bottom:1px solid rgba(255,255,255,.72)!important;
  -webkit-backdrop-filter:blur(18px);
  backdrop-filter:blur(18px);
}

/* Buttons */
.primary,
.secondary{
  border-radius:18px!important;
  transition:
    transform .25s cubic-bezier(.22,1,.36,1),
    box-shadow .25s ease,
    background .25s ease;
}

.primary{
  box-shadow:
    0 13px 30px rgba(23,105,224,.22),
    0 0 25px rgba(45,131,246,.10),
    inset 0 1px rgba(255,255,255,.30)!important;
}

.primary:hover,
.secondary:hover{
  transform:translateY(-2px);
}

.primary:active,
.secondary:active{
  transform:scale(.975);
}

/* Pills/status */
.pill,
.status,
.support-status{
  border-radius:999px!important;
  border:1px solid rgba(255,255,255,.65);
  box-shadow:inset 0 1px rgba(255,255,255,.75);
}

/* Inputs */
.authcard input,
.modalcard input,
.modalcard select,
.modalcard textarea{
  border:1px solid rgba(190,210,235,.70)!important;
  background:rgba(255,255,255,.50)!important;
  border-radius:16px!important;
  box-shadow:inset 0 1px rgba(255,255,255,.85);
  transition:border-color .25s ease,box-shadow .25s ease,background .25s ease;
}

.authcard input:focus,
.modalcard input:focus,
.modalcard textarea:focus,
.modalcard select:focus{
  background:rgba(255,255,255,.72)!important;
  border-color:rgba(23,105,224,.48)!important;
  box-shadow:
    0 0 0 4px rgba(23,105,224,.08),
    0 8px 24px rgba(23,105,224,.08),
    inset 0 1px rgba(255,255,255,1)!important;
}

/* Modals */
.modal{
  background:rgba(20,32,51,.38)!important;
  -webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);
}

.modalcard{
  border-radius:29px!important;
}

/* Auth */
.auth{
  background:
    radial-gradient(circle at 15% 25%,rgba(80,155,255,.16),transparent 30%),
    radial-gradient(circle at 85% 75%,rgba(23,105,224,.10),transparent 30%),
    var(--cf-bg);
}

.visual{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 80% 18%,rgba(91,170,255,.28),transparent 28%),
    linear-gradient(145deg,#1769e0,#0b4eb7)!important;
}

.visual::after{
  content:"";
  position:absolute;
  width:320px;
  height:320px;
  right:-120px;
  bottom:-140px;
  border-radius:50%;
  background:rgba(100,180,255,.20);
  filter:blur(60px);
  pointer-events:none;
}

.flow b{
  border-radius:999px!important;
  background:rgba(255,255,255,.08);
  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);
}

/* Support */
.support-card{
  border-radius:24px!important;
}
.support-reply{
  border-radius:16px!important;
  background:rgba(245,249,255,.48)!important;
  border-color:rgba(255,255,255,.75)!important;
}

/* Respect reduced-motion preferences */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    scroll-behavior:auto!important;
    transition-duration:.01ms!important;
    animation-duration:.01ms!important;
  }
}

/* Feature 1: escalation UI */
.cf-escalation{
  margin-top:12px;
  padding:11px 12px;
  border-radius:16px;
  background:rgba(255,255,255,.34);
  border:1px solid rgba(255,255,255,.65);
}
.cf-escalation.is-delayed{

}
.cf-sla-row{

  align-items:center;
  justify-content:space-between;

}

/* =========================================================
   CIVICFIX — FINAL PRODUCT POLISH
   Visual/micro-interaction layer. Core civic logic unchanged.
   ========================================================= */
:root{
  --cf-ease:cubic-bezier(.22,1,.36,1);
  --cf-fast:180ms;
  --cf-mid:320ms;
  --cf-slow:520ms;
}

/* Global motion language */
button,.ghost,.primary,.secondary,.pill,.status,.card,.stat,.support-card,
.cf-case-tools,.cf-duplicate,.cf-routing,.cf-resolution,.cf-dept-row,
.cf-cluster,.cf-watch-item,.cf-impact-panel,.cf-dept-panel,.cf-cluster-panel{
  transition:
    transform var(--cf-mid) var(--cf-ease),
    opacity var(--cf-mid) ease,
    box-shadow var(--cf-mid) ease,
    border-color var(--cf-mid) ease,
    background-color var(--cf-mid) ease,
    color var(--cf-fast) ease;
}

.card,.stat,.support-card,.cf-impact-panel,.cf-dept-panel,.cf-cluster-panel{
  animation:cfRiseIn var(--cf-slow) var(--cf-ease) both;
}

.cards>.card:nth-child(2),.stats>.stat:nth-child(2){animation-delay:45ms}
.cards>.card:nth-child(3),.stats>.stat:nth-child(3){animation-delay:90ms}
.cards>.card:nth-child(4),.stats>.stat:nth-child(4){animation-delay:135ms}
.cards>.card:nth-child(5){animation-delay:180ms}
.cards>.card:nth-child(6){animation-delay:225ms}

@keyframes cfRiseIn{
  from{opacity:0;transform:translateY(12px) scale(.985)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

.cf-page-enter main.page{animation:cfPageIn 420ms var(--cf-ease) both}
@keyframes cfPageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.card:hover,.stat:hover,.support-card:hover{
  box-shadow:0 25px 60px rgba(31,91,176,.15),0 0 34px rgba(45,131,246,.075),inset 0 1px rgba(255,255,255,1)!important;
}

button:active:not(:disabled){transform:scale(.975)!important}
button:disabled{cursor:not-allowed;opacity:.62}

/* Professional case identity + relative time */
.cf-case-id{
  display:inline-flex;
  align-items:center;
  gap:5px;
  margin-top:4px;
  font-size:9px;
  font-weight:850;
  letter-spacing:.55px;
  color:#667085;
}
.cf-case-id::before{content:'CASE';font-size:7px;letter-spacing:1px;color:#98a2b3}
.cf-time-ago{font-size:9px;color:#667085}

/* Status indicators */
.status::before{
  content:'●';
  display:inline-block;
  margin-right:5px;
  font-size:8px;
  transform:translateY(-.5px);
}
.status.resolved::before,.status.verified::before{content:'✓';font-size:9px}
.status.in.progress::before{animation:cfPulse 1.8s ease-in-out infinite}
@keyframes cfPulse{50%{opacity:.35;transform:scale(.75)}}

/* Analytics */
.cf-analytics-panel{
  padding:20px;
  border-radius:27px;
  background:linear-gradient(135deg,rgba(255,255,255,.72),rgba(232,243,255,.43));
  border:1px solid rgba(255,255,255,.90);
  box-shadow:0 22px 55px rgba(31,91,176,.11),inset 0 1px rgba(255,255,255,.98);
  -webkit-backdrop-filter:blur(28px) saturate(170%);
  backdrop-filter:blur(28px) saturate(170%);
}
.cf-analytics-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:15px}
.cf-metric{
  padding:13px;
  border-radius:19px;
  background:rgba(255,255,255,.42);
  border:1px solid rgba(255,255,255,.72);
  box-shadow:inset 0 1px rgba(255,255,255,.9);
}
.cf-metric-top{display:flex;align-items:end;justify-content:space-between;gap:7px}
.cf-metric b{font-size:25px;letter-spacing:-.8px}
.cf-metric span{display:block;font-size:9px;color:#667085;margin-top:3px}
.cf-bar{height:8px;margin-top:10px;border-radius:999px;background:rgba(193,213,237,.36);overflow:hidden}
.cf-bar>i{display:block;height:100%;width:var(--value);border-radius:inherit;background:linear-gradient(90deg,#1769e0,#63a6ff);box-shadow:0 0 16px rgba(45,131,246,.28);transform-origin:left center;animation:cfBarIn 900ms var(--cf-ease) both}
@keyframes cfBarIn{from{transform:scaleX(0);opacity:.4}to{transform:scaleX(1);opacity:1}}
.cf-pulse-chart{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:17px}
.cf-pulse-row{padding:13px;border-radius:18px;background:rgba(255,255,255,.38);border:1px solid rgba(255,255,255,.68)}
.cf-pulse-row>div:first-child{display:flex;justify-content:space-between;font-size:10px;font-weight:850}
.cf-spark{height:48px;display:flex;align-items:end;gap:4px;margin-top:8px}
.cf-spark i{flex:1;min-height:6px;border-radius:999px 999px 4px 4px;background:linear-gradient(180deg,#5da2ff,#1769e0);opacity:.82;transform-origin:bottom;animation:cfSparkIn 650ms var(--cf-ease) both}
@keyframes cfSparkIn{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.cf-dept-bars{display:grid;gap:10px;margin-top:15px}
.cf-dept-bar-row{display:grid;grid-template-columns:1.35fr 2.5fr auto;align-items:center;gap:10px}
.cf-dept-bar-row>span{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cf-dept-track{height:9px;border-radius:999px;background:rgba(193,213,237,.34);overflow:hidden}
.cf-dept-track i{display:block;height:100%;width:var(--value);border-radius:inherit;background:linear-gradient(90deg,#1769e0,#75b1ff);box-shadow:0 0 14px rgba(45,131,246,.20);animation:cfBarIn 850ms var(--cf-ease) both}
.cf-dept-bar-row b{font-size:11px}

/* Toasts */
#cfToastHost{position:fixed;right:18px;bottom:18px;z-index:30000;display:grid;gap:9px;width:min(360px,calc(100vw - 28px));pointer-events:none}
.cf-toast{pointer-events:auto;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:13px 14px;border-radius:19px;background:linear-gradient(135deg,rgba(255,255,255,.84),rgba(232,243,255,.62));border:1px solid rgba(255,255,255,.95);box-shadow:0 18px 42px rgba(31,91,176,.17),inset 0 1px rgba(255,255,255,1);-webkit-backdrop-filter:blur(24px) saturate(175%);backdrop-filter:blur(24px) saturate(175%);animation:cfToastIn 360ms var(--cf-ease) both;font-size:11px;font-weight:750;color:#142033}
.cf-toast.out{animation:cfToastOut 300ms var(--cf-ease) both}
.cf-toast-icon{width:27px;height:27px;display:grid;place-items:center;border-radius:10px;background:rgba(23,105,224,.11);color:#1769e0;font-weight:950}
.cf-toast.error .cf-toast-icon{background:rgba(180,35,24,.10);color:#b42318}
.cf-toast.warn .cf-toast-icon{background:rgba(154,91,0,.10);color:#9a5b00}
.cf-toast-close{border:0;background:transparent;color:#667085;font-size:17px;line-height:1;cursor:pointer;padding:2px}
@keyframes cfToastIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
@keyframes cfToastOut{to{opacity:0;transform:translateY(10px) scale(.97)}}

/* Empty states */
.empty{border-radius:25px!important;padding:28px!important}
.empty::before{content:'✓';display:grid;place-items:center;width:38px;height:38px;margin:0 auto 10px;border-radius:13px;background:rgba(23,105,224,.08);color:#1769e0;font-weight:950}

@media(max-width:800px){
  #cfToastHost{right:10px;left:10px;bottom:calc(88px + env(safe-area-inset-bottom));width:auto}
  .cf-analytics-grid{grid-template-columns:1fr 1fr}
  .cf-pulse-chart{grid-template-columns:1fr}
  .cf-dept-bar-row{grid-template-columns:1.1fr 1.7fr auto;gap:7px}
  .cf-analytics-panel{padding:16px;border-radius:23px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

function signup(){
  document.body.innerHTML=`
    <div class="auth">
      <section class="visual">
        <div class="eyebrow" style="color:#fff">JHARKHAND CIVIC PLATFORM</div>
        <h1>Join CivicFix.</h1>

          <input id="name" type="text" placeholder="Your full name" required>
        </label>

          Email
          <input id="semail" type="email" placeholder="you@example.com" required>
        </label>

        <label>
          Password

        </button>

        </button>

    </div>`;

  $("#signup").onsubmit=async e=>{

    const name=$("#name").value.trim();

/* =========================================================
   CIVIC ESCALATION ENGINE — FEATURE 1
   Carefully additive: existing complaint/report/map/auth
   functions are left intact.
   ========================================================= */

const CF_ESCALATION_SLA_HOURS = {
  "Pothole / Road": 72,
  "Garbage / Waste": 24,
  "Water Leakage": 24,
  "Broken Streetlight": 72,
  "Open Drainage": 24,
  "Other": 72
};

function cfSlaHours(category){
  return CF_ESCALATION_SLA_HOURS[category] || 72;
}

function cfComplaintAgeHours(c){
  const created = new Date(c.created_at || Date.now()).getTime();
  return Math.max(0,(Date.now()-created)/3600000);
}

function cfIsEscalationEligible(c){
  if(!c || c.status==="Resolved" || c.status==="Verified") return false;
  return cfComplaintAgeHours(c) >= cfSlaHours(c.category);
}

function cfEscalationLevel(c, escalationCount=0){
  if(!cfIsEscalationEligible(c) && escalationCount===0) return 0;
  if(escalationCount>=2) return 3;
  if(escalationCount>=1) return 2;
  return 1;
}

function cfSlaLabel(c){
  const hours=cfSlaHours(c.category);
  const age=cfComplaintAgeHours(c);
  if(age>=hours){
    const late=Math.max(0,Math.floor(age-hours));
    if(late<24) return `Delayed by ${late||1}h`;
    return `Delayed by ${Math.floor(late/24)}d`;
  }
  const left=Math.max(1,Math.ceil(hours-age));
  if(left<24) return `${left}h remaining`;
  return `${Math.ceil(left/24)}d remaining`;
}

function cfSlaClass(c){
  if(cfIsEscalationEligible(c)) return "cf-sla delayed";
  const ratio=cfComplaintAgeHours(c)/cfSlaHours(c.category);
  return ratio>=.75 ? "cf-sla warning" : "cf-sla";
}

function cfEscalationsForComplaint(id){
  return (state.escalations||[]).filter(x=>x.complaint_id===id);
}

async function loadEscalations(){
  if(!sb || !state.session){
    state.escalations=[];
    return;
  }
  const {data,error}=await sb
    .from("civic_escalations")
    .select("*,complaints:complaint_id(category,area,status,created_at,citizen_id)")
    .order("created_at",{ascending:false});

  if(!error) state.escalations=data||[];
  else state.escalations=[];
}

async function cfBuzzComplaint(id){
  const c=state.complaints.find(x=>x.id===id);
  if(!c) return;

  if(!cfIsEscalationEligible(c)){
    return alert(`This complaint can be escalated after its ${cfSlaHours(c.category)}-hour response window has passed.`);
  }

  const previous=cfEscalationsForComplaint(id);
  const last=previous[0];
  if(last){
    const hours=(Date.now()-new Date(last.created_at).getTime())/3600000;
    if(hours<48){
      return alert(`A follow-up was already sent. You can buzz the department again after ${Math.ceil(48-hours)} hours.`);
    }
  }

  const {error}=await sb.from("civic_escalations").insert({
    complaint_id:id,
    citizen_id:state.session.user.id,
    escalation_type:"Citizen Follow-up",
    message:"Citizen requested an escalation because the complaint has exceeded its expected response time."
  });

  if(error) return alert(error.message);

  await loadEscalations();
  await loadComplaints();
  render();
  alert("Your follow-up has been sent to the responsible team.");
}

function cfEscalationPanel(c, compact=false){
  const escalations=cfEscalationsForComplaint(c.id);
  const eligible=cfIsEscalationEligible(c);
  const mine=escalations.filter(x=>x.citizen_id===state.session.user.id);
  const lastMine=mine[0];
  let cooldown=false;

  if(lastMine){
    cooldown=(Date.now()-new Date(lastMine.created_at).getTime())/3600000<48;
  }

  const level=cfEscalationLevel(c,escalations.length);
  const delayed=eligible;

  return `
    <div class="cf-escalation ${delayed?"is-delayed":""}">
      <div class="cf-sla-row">
        <span class="${cfSlaClass(c)}">
          ${delayed?"⚠ ":""}${esc(cfSlaLabel(c))}
        </span>
        <span class="cf-sla-meta">SLA ${cfSlaHours(c.category)}h</span>
      </div>
      ${

async function submitReport(e){
  e.preventDefault();

  const btn = e.submitter;
  btn.disabled = true;
  btn.textContent = "Submitting...";

  try {
    const category = $("#cat").value;
    const description = $("#desc").value.trim();
    const area = $("#area").value.trim();
    const district = $("#district").value;
   const local_type = $("#localType").value;

const photoInput = $("#photo");
const photoFile = photoInput?.files?.[0] || null;

if (!photoFile) {
  throw new Error("Please attach a photo before submitting the complaint.");
}

    const score =
      ({"Pothole / Road":65,
        "Open Drainage":60,
        "Water Leakage":58,
        "Garbage / Waste":55}[category] || 35)
      +
      (/accident|danger|school|hospital|blocked|flood|injur|emergency/i.test(description) ? 20 : 0);

    let photo_url = null;

    /* Upload evidence photo if one was selected */
    if (photoFile) {

      if (!photoFile.type.startsWith("image/")) {
        throw new Error("Please select a valid image file.");
      }

      if (photoFile.size > 5 * 1024 * 1024) {
        throw new Error("Photo must be smaller than 5 MB.");
      }

      const extension =
        photoFile.name.split(".").pop().toLowerCase();

      const filePath =
        `${state.session.user.id}/${crypto.randomUUID()}.${extension}`;

      const { error: uploadError } =
        await sb.storage
          .from("complaint-evidence")
          .upload(filePath, photoFile, {
            cacheControl: "3600",
            upsert: false,
            contentType: photoFile.type
          });

      if (uploadError) {
        throw uploadError;
      }

      const { data: publicData } =
        sb.storage
          .from("complaint-evidence")
          .getPublicUrl(filePath);

      photo_url = publicData.publicUrl;
    }

    /* Create complaint */
    const { error } = await sb
      .from("complaints")
      .insert({
        citizen_id: state.session.user.id,
        category,
        area,
        district,
        local_body_type: local_type,
        description,
        latitude: gpsCoords?.[0] ?? null,
        longitude: gpsCoords?.[1] ?? null,
        priority: score >= 75 ? "High" : score >= 50 ? "Medium" : "Low",
        priority_score: Math.min(100, score),
        department: departments[category],
        status: "Pending",
        photo_url
      });

    if (error) {
      throw error;
    }

    closeReport();

    await loadComplaints();

    render();

    alert("Complaint submitted successfully.");

  } catch (x) {

    $("#rerr").innerHTML =
      '<div class="error">' + esc(x.message) + '</div>';

    btn.disabled = false;
    btn.textContent = "Submit complaint";
  }
}

state.events = state.events || [];
state.confirmations = state.confirmations || [];
state.watches = state.watches || [];

const CF_FEATURES_VERSION = "1.0.0";

function cfEsc(s){ return esc(s); }

function cfUserOwnsComplaint(c){
  return !!(c && state.session && c.citizen_id===state.session.user.id);
}

async function loadCivicExtras(){
  if(!sb || !state.session) return;
  const [ev,cf,wa,re] = await Promise.all([
    sb.from("complaint_events").select("*").order("created_at",{ascending:true}),
    sb.from("complaint_confirmations").select("*").order("created_at",{ascending:false}),
    sb.from("civic_watches").select("*").order("created_at",{ascending:false}),
    sb.from("resolution_evidence").select("*").order("created_at",{ascending:false})
  ]);
  state.events = ev.error ? [] : (ev.data||[]);
  state.confirmations = cf.error ? [] : (cf.data||[]);
  state.watches = wa.error ? [] : (wa.data||[]);
  state.resolutionEvidence = re.error ? [] : (re.data||[]);
}

function cfEvents(id){
  return (state.events||[]).filter(x=>x.complaint_id===id);
}

function cfConfirmations(id){
  return (state.confirmations||[]).filter(x=>x.complaint_id===id);
}

function cfWatch(id){
  return (state.watches||[]).find(x=>x.complaint_id===id && x.user_id===state.session.user.id);
}

function cfEvidence(id){
  return (state.resolutionEvidence||[]).filter(x=>x.complaint_id===id);
}

function cfDistanceKm(aLat,aLng,bLat,bLng){
  const R=6371, rad=Math.PI/180;
  const dLat=(bLat-aLat)*rad, dLng=(bLng-aLng)*rad;
  const a=Math.sin(dLat/2)**2+
    Math.cos(aLat*rad)*Math.cos(bLat*rad)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function cfDuplicateGroup(c){
  if(c.latitude==null || c.longitude==null) return [];
  return state.complaints.filter(x=>
    x.id!==c.id &&
    x.category===c.category &&
    x.latitude!=null &&
    x.longitude!=null &&
    cfDistanceKm(c.latitude,c.longitude,x.latitude,x.longitude)<=0.25
  );
}

function cfAffectedCount(c){
  const confirmations=cfConfirmations(c.id).length;
  const duplicates=cfDuplicateGroup(c).length;
  return Math.max(1,1+confirmations+duplicates);
}

function cfImpactScore(c){
  const base=Number(c.priority_score)||35;
  const affected=cfAffectedCount(c);
  const ageBonus=Math.min(15,Math.floor(cfComplaintAgeHours(c)/24)*3);
  return Math.min(100,Math.round(base + Math.min(25,(affected-1)*5) + ageBonus));
}

function cfPriorityLabel(score){
  if(score>=80) return "Critical";
  if(score>=60) return "High";
  if(score>=40) return "Medium";
  return "Low";
}

function cfRouteInfo(c){
  const department=c.department || departments[c.category] || "Municipal Services";
  return {
    department,
    reason:`${c.category} is routed to ${department}`
  };
}

async function cfUploadResolutionEvidence(id){
  const c=state.complaints.find(x=>x.id===id);
  if(!c) return;
  const input=document.createElement("input");
  input.type="file";
  input.accept="image/*";
  input.capture="environment";
  input.onchange=async()=>{
    const file=input.files?.[0];
    if(!file) return;
    if(!file.type.startsWith("image/")) return alert("Please select an image.");
    if(file.size>5*1024*1024) return alert("Evidence photo must be smaller than 5 MB.");
    try{
      const path=`resolution/${c.id}/${state.session.user.id}/${crypto.randomUUID()}.${file.name.split(".").pop().toLowerCase()}`;
      const {error:upErr}=await sb.storage.from("complaint-evidence").upload(path,file,{
        cacheControl:"3600",
        upsert:false,
        contentType:file.type
      });
      if(upErr) throw upErr;
      const {data:urlData}=sb.storage.from("complaint-evidence").getPublicUrl(path);
      const {error}=await sb.from("resolution_evidence").insert({
        complaint_id:c.id,
        worker_id:state.session.user.id,
        photo_url:urlData.publicUrl,
        note:"Resolution evidence submitted by field worker."
      });
      if(error) throw error;
      const {error:statusError}=await sb.from("complaints").update({status:"Resolved"}).eq("id",id);
      if(statusError) throw statusError;
      await cfAddEvent(id,"Resolution Evidence","Field worker submitted resolution evidence.",state.session.user.id);
      await loadComplaints();
      await loadCivicExtras();
      render();
      alert("Resolution evidence submitted. The citizen can now verify the fix.");
    }catch(e){ alert(e.message); }
  };
  input.click();
}

async function cfVerifyResolution(id,verified){
  const c=state.complaints.find(x=>x.id===id);
  if(!c) return;
  const next=verified?"Verified":"Pending";
  const note=verified?"Citizen confirmed the resolution.":"Citizen reported that the issue is still present.";
  const {error}=await sb.from("complaints").update({status:next}).eq("id",id);

  await cfAddEvent(id,verified?"Verified":"Reopened",note,state.session.user.id);
  await loadComplaints();
  await loadCivicExtras();
  render();
}

      ${evidence.map(e=>`
        <img src="${cfEsc(e.photo_url)}" alt="Resolution evidence">
        ${e.note?`<div class="muted">${cfEsc(e.note)}</div>`:""}
      `).join("")}
      ${
        state.profile.role==="citizen" && c.status==="Resolved"
        ? `<div class="actions">
             <button class="primary" type="button" onclick="cfVerifyResolution('${c.id}',true)">Confirm resolved</button>
             <button class="secondary" type="button" onclick="cfVerifyResolution('${c.id}',false)">Still not fixed</button>
           </div>`
        : ""
      }
    </div>`;
}

function cfFeatureCardAddon(c){
  const confirmations=cfConfirmations(c.id);
  const watched=!!cfWatch(c.id);
  const duplicates=cfDuplicateGroup(c);
  const impact=cfImpactScore(c);
  const route=cfRouteInfo(c);
  return `
    <div class="cf-case-tools">
      <div class="cf-impact">
        <span>Impact</span><b>${impact}/100</b><em>${cfPriorityLabel(impact)}</em>
      </div>
      <div class="cf-community">
        <b>${cfAffectedCount(c)}</b>
        <span>citizen${cfAffectedCount(c)===1?"":"s"} affected</span>
        ${confirmations.length?`<small>+${confirmations.length} confirmations</small>`:""}
      </div>
    </div>
    ${
      duplicates.length
      ? `<div class="cf-duplicate">
          <b>Possible duplicate cluster</b>
          <span>${duplicates.length+1} nearby ${cfEsc(c.category)} report${duplicates.length+1===1?"":"s"}</span>
        </div>`
      : ""
    }
    <div class="cf-routing">
      <span>Routed to <b>${cfEsc(route.department)}</b></span>
      <span>${cfEsc(route.reason)}</span>
    </div>
    <div class="actions cf-feature-actions">
      <button class="secondary" type="button" onclick="cfOpenTimeline('${c.id}')">View timeline</button>
      ${
        state.profile.role==="citizen"
        ? `<button class="secondary" type="button" onclick="cfToggleWatch('${c.id}')">${watched?"Watching":"Watch case"}</button>`
        : ""
      }
      ${
        state.profile.role==="citizen" && !cfUserOwnsComplaint(c)
        ? `<button class="secondary" type="button" onclick="cfConfirmIssue('${c.id}')">I have this problem too</button>`
        : ""
      }
      ${
        state.profile.role==="worker" && c.status==="In Progress"
        ? `<button class="primary" type="button" onclick="cfUploadResolutionEvidence('${c.id}')">Upload resolution evidence</button>`
        : ""
      }
    </div>
    ${cfResolutionBlock(c)}
  `;
}

function cfImpactMapPanel(){
  if(state.profile.role!=="admin") return "";
  const high=state.complaints.filter(c=>cfImpactScore(c)>=70).length;
  const delayed=state.complaints.filter(c=>cfIsEscalationEligible(c)).length;
  const affected=state.complaints.reduce((n,c)=>n+cfAffectedCount(c),0);
  return `
    <section class="section">
      <div class="cf-impact-panel">
        <div>
          <div class="eyebrow">CIVIC IMPACT</div>
          <h2>Where attention is needed</h2>
          <p class="muted">Impact combines priority, age and community signals. Use the live map above to inspect locations.</p>
        </div>
        <div class="cf-impact-grid">
          <div><b>${high}</b><span>High-impact cases</span></div>
          <div><b>${delayed}</b><span>Delayed cases</span></div>
          <div><b>${affected}</b><span>Estimated affected reports</span></div>
        </div>
      </div>
    </section>`;
}

function cfWatchPanel(){
  if(state.profile.role!=="citizen") return "";
  const watched=state.watches.map(w=>state.complaints.find(c=>c.id===w.complaint_id)).filter(Boolean);
  if(!watched.length) return "";
  return `
    <section class="section">
      <div class="between">
        <div><h2>Watching</h2><p class="muted">Cases you want CivicFix to keep visible to you.</p></div>
      </div>
      <div class="cards">
        ${watched.map(c=>`
          <article class="card">
            <div class="between">
              <div><b>${cfEsc(c.category)}</b><div class="muted">${cfEsc(c.area)}</div></div>
              <span class="status ${String(c.status).toLowerCase()}">${cfEsc(c.status)}</span>
            </div>
            <div class="meta"><span>${cfEsc(cfSlaLabel(c))}</span><span>Impact ${cfImpactScore(c)}/100</span></div>
          </article>`).join("")}
      </div>
    </section>`;
}

/* ---- Wrap existing functions rather than replacing their logic ---- */

const cfOriginalHydrate = hydrate;
hydrate = async function(){
  await cfOriginalHydrate();
  await loadCivicExtras();
};

const cfOriginalCard = card;
card = function(c,admin=false){
  const base=cfOriginalCard(c,admin);
  return base.replace("</article>",`${cfFeatureCardAddon(c)}</article>`);
};

const cfOriginalCitizen = citizen;
citizen = function(){
  return cfOriginalCitizen()+cfNearbySection()+cfWatchPanel();
};

const cfOriginalAdmin = admin;
admin = function(){
  return cfOriginalAdmin()+cfImpactMapPanel();
};

const cfOriginalWorker = worker;
worker = function(){
  return cfOriginalWorker();
};

/* Log key state changes without altering their outcomes. */
const cfOriginalAssign = assign;
assign = async function(id){
  await cfOriginalAssign(id);
  await cfAddEvent(id,"Assigned","Complaint assigned to a field worker.",state.session.user.id);
  await loadCivicExtras();
  render();
};

const cfOriginalChangeStatus = changeStatus;
changeStatus = async function(id,status){
  if(status==="Resolved" && state.profile?.role==="worker"){
    const existing=cfEvidence(id);
    if(!existing.length){
      alert("Resolution evidence is required before a case can be marked resolved.");
      return cfUploadResolutionEvidence(id);
    }
  }

  await cfOriginalChangeStatus(id,status);
  const messages={
    "In Progress":"Field worker started work.",
    "Resolved":"Field worker marked the complaint resolved.",
    "Verified":"Citizen verified the resolution."
  };
  await cfAddEvent(id,status,messages[status]||`Complaint status changed to ${status}.`,state.session.user.id);
  await loadCivicExtras();
  render();
};

/* Capture a new complaint after the original submission succeeds. */
const cfOriginalSubmitReport = submitReport;
submitReport = async function(e){
  const beforeIds=new Set((state.complaints||[]).map(c=>c.id));
  await cfOriginalSubmitReport(e);
  await loadComplaints();
  const created=state.complaints.find(c=>!beforeIds.has(c.id));
  if(created){
    await cfAddEvent(created.id,"Reported","Complaint submitted by citizen.",state.session.user.id);
    await loadCivicExtras();
    render();
  }
};

/* Capture Customer Care as part of the same case ecosystem. */
const cfOriginalSubmitSupport = submitSupport;
submitSupport = async function(e){
  await cfOriginalSubmitSupport(e);
  await loadCivicExtras();
};

/* Re-run extras after a login/session refresh. */
const cfOriginalLogout = logout;
logout = async function(){
  await cfOriginalLogout();
  state.events=[];
  state.confirmations=[];
  state.watches=[];
  state.resolutionEvidence=[];
};

/* Feature suite version marker for debugging. */
window.CivicFixFeatures = {
  version:CF_FEATURES_VERSION,
  enabled:[
    "escalation",
    "timeline",
    "resolution-verification",
    "community-confirmation",
    "duplicate-clustering",
    "nearby-issues",
    "impact-intelligence",
    "smart-routing",
    "department-intelligence",
    "civic-watch"
  ]
};


/* ---- Additional intelligence views ---- */
function cfDepartmentAnalytics(){
  if(state.profile.role!=="admin") return "";
  const rows={};
  state.complaints.forEach(c=>{
    const d=c.department||"Municipal Services";
    rows[d] ||= {total:0,resolved:0,delayed:0,impact:0};
    rows[d].total++;
    if(c.status==="Resolved"||c.status==="Verified") rows[d].resolved++;
    if(cfIsEscalationEligible(c)) rows[d].delayed++;
    rows[d].impact += cfImpactScore(c);
  });
  const list=Object.entries(rows).map(([name,v])=>({
    name,...v,
    rate:v.total?Math.round(v.resolved/v.total*100):0,
    avg:v.total?Math.round(v.impact/v.total):0
  })).sort((a,b)=>b.delayed-a.delayed||b.total-a.total);

  return `
    <section class="section">
      <div class="cf-dept-panel">
        <div class="between">
          <div>
            <div class="eyebrow">DEPARTMENT INTELLIGENCE</div>
            <h2>Operational performance</h2>
            <p class="muted">Internal indicators derived from the current civic queue.</p>
          </div>
        </div>
        <div class="cf-dept-table">
          ${list.map(d=>`
            <div class="cf-dept-row">
              <div><b>${cfEsc(d.name)}</b><span>${d.total} case${d.total===1?"":"s"}</span></div>
              <div><strong>${d.rate}%</strong><span>resolved</span></div>
              <div><strong class="${d.delayed?"cf-red":""}">${d.delayed}</strong><span>delayed</span></div>
              <div><strong>${d.avg}</strong><span>avg impact</span></div>
            </div>`).join("")}
        </div>
      </div>
    </section>`;
}

const cfOriginalAdminWithIntelligence = admin;
admin = function(){
  return cfOriginalAdminWithIntelligence()+cfDepartmentAnalytics();
};

function cfImpactCircles(){
  if(!state.map || state.profile.role!=="admin") return;
  const items=state.complaints.filter(c=>c.latitude!=null&&c.longitude!=null);
  items.forEach(c=>{
    const score=cfImpactScore(c);
    const radius=60+score*2.2;
    const circle=L.circle([c.latitude,c.longitude],{
      radius,
      color:score>=80?"#b42318":score>=60?"#d97706":"#1769e0",
      weight:1,
      fillOpacity:.055,
      opacity:.25,
      interactive:false
    }).addTo(state.map);
    circle._cfImpact=true;
  });
}

const cfOriginalDrawMap = drawMap;
drawMap = function(){
  cfOriginalDrawMap();
  setTimeout(cfImpactCircles,120);
};


function cfDuplicateClusters(){
  if(state.profile.role!=="admin") return "";
  const groups=[];
  const seen=new Set();

  state.complaints.forEach(c=>{
    if(seen.has(c.id) || c.latitude==null || c.longitude==null) return;
    const members=[c,...cfDuplicateGroup(c)];
    if(members.length<2) return;
    members.forEach(x=>seen.add(x.id));
    groups.push({lead:c,members});
  });

  if(!groups.length) return "";

  return `
    <section class="section">
      <div class="cf-cluster-panel">
        <div class="eyebrow">COMMUNITY SIGNALS</div>
        <h2>Potential duplicate clusters</h2>
        <p class="muted">Nearby reports of the same category are grouped for administrative review.</p>
        <div class="cf-clusters">
          ${groups.slice(0,8).map(g=>`
            <div class="cf-cluster">
              <div>
                <b>${cfEsc(g.lead.category)}</b>
                <span>${cfEsc(g.lead.area)}</span>
              </div>
              <strong>${g.members.length}<small> related reports</small></strong>
              <span class="cf-cluster-impact">Impact ${cfImpactScore(g.lead)}/100</span>
            </div>`).join("")}
        </div>
      </div>
    </section>`;
}

const cfAdminBeforeClusters = admin;
admin = function(){
  return cfAdminBeforeClusters()+cfDuplicateClusters();
};


/* =========================================================
   FINAL POLISH HELPERS
   ========================================================= */
function cfCaseId(c){
  const raw=String(c?.id||'').replace(/[^a-zA-Z0-9]/g,'').toUpperCase();
  return 'CF-'+(raw.slice(-6)||'000000');
}
function cfTimeAgo(value){
  if(!value) return '';
  const ms=Date.now()-new Date(value).getTime();
  const mins=Math.max(0,Math.floor(ms/60000));
  if(mins<1) return 'just now';
  if(mins<60) return `${mins}m ago`;
  const hrs=Math.floor(mins/60);
  if(hrs<24) return `${hrs}h ago`;
  const days=Math.floor(hrs/24);
  if(days<7) return `${days}d ago`;
  return new Date(value).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
}
function cfToast(message,type='success'){
  let host=document.getElementById('cfToastHost');
  if(!host){
    host=document.createElement('div');
    host.id='cfToastHost';
    document.body.appendChild(host);
  }
  const t=document.createElement('div');
  t.className=`cf-toast ${type}`;
  const icon=type==='error'?'!':type==='warn'?'⚠':'✓';
  t.innerHTML=`<span class="cf-toast-icon">${icon}</span><span>${esc(String(message))}</span><button class="cf-toast-close" type="button" aria-label="Dismiss">×</button>`;
  host.appendChild(t);
  const close=()=>{if(t.classList.contains('out'))return;t.classList.add('out');setTimeout(()=>t.remove(),300)};
  t.querySelector('.cf-toast-close').onclick=close;
  setTimeout(close,3600);
}

/* Keep existing alert() call sites working while upgrading their presentation. */
window.alert=function(message){
  const text=String(message||'');
  const type=/error|failed|denied|unable|invalid|not available|exceeded/i.test(text)?'error':/warning|overdue|already|please|cannot|must/i.test(text)?'warn':'success';
  cfToast(text,type);
};

function cfAnalyticsOverview(){
  if(!state.profile || state.profile.role!=='admin') return '';
  const x=state.complaints||[];
  const total=x.length;
  const resolved=x.filter(c=>c.status==='Resolved'||c.status==='Verified').length;
  const delayed=x.filter(c=>cfIsEscalationEligible(c)).length;
  const verified=x.filter(c=>c.status==='Verified').length;
  const resolution=total?Math.round(resolved/total*100):0;
  const sla=total?Math.round((total-delayed)/total*100):100;
  const verification=resolved?Math.round(verified/resolved*100):0;
  const impact=x.reduce((s,c)=>s+cfImpactScore(c),0);
  const avgImpact=total?Math.round(impact/total):0;

  const dept={};
  x.forEach(c=>{
    const d=c.department||'Municipal Services';
    dept[d]=(dept[d]||0)+1;
  });
  const deptRows=Object.entries(dept).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxDept=Math.max(1,...deptRows.map(x=>x[1]));

  const days=[];
  for(let i=6;i>=0;i--){
    const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);
    const next=new Date(d);next.setDate(next.getDate()+1);
    const reports=x.filter(c=>{const t=new Date(c.created_at||0);return t>=d&&t<next}).length;
    const done=x.filter(c=>{const t=new Date(c.updated_at||c.created_at||0);return t>=d&&t<next&&(c.status==='Resolved'||c.status==='Verified')}).length;
    const escs=(state.escalations||[]).filter(e=>{const t=new Date(e.created_at||0);return t>=d&&t<next}).length;
    days.push({reports,done,escs,label:d.toLocaleDateString(undefined,{weekday:'short'})});
  }
  const max=Math.max(1,...days.flatMap(d=>[d.reports,d.done,d.escs]));
  const spark=key=>days.map((d,i)=>`<i title="${d.label}: ${d[key]}" style="height:${Math.max(10,Math.round(d[key]/max*100))}%;animation-delay:${i*45}ms"></i>`).join('');

  return `<section class="section">
    <div class="cf-analytics-panel">
      <div class="between">
        <div><div class="eyebrow">CIVIC OPERATIONS</div><h2>Performance overview</h2><p class="muted">Live indicators calculated from the current civic queue.</p></div>
      </div>
      <div class="cf-analytics-grid">
        <div class="cf-metric"><div class="cf-metric-top"><b>${resolution}%</b><span>Resolution</span></div><div class="cf-bar"><i style="--value:${resolution}%"></i></div></div>
        <div class="cf-metric"><div class="cf-metric-top"><b>${sla}%</b><span>SLA compliance</span></div><div class="cf-bar"><i style="--value:${sla}%"></i></div></div>
        <div class="cf-metric"><div class="cf-metric-top"><b>${verification}%</b><span>Citizen verified</span></div><div class="cf-bar"><i style="--value:${verification}%"></i></div></div>
        <div class="cf-metric"><div class="cf-metric-top"><b>${avgImpact}</b><span>Avg. impact</span></div><div class="cf-bar"><i style="--value:${Math.min(100,avgImpact)}%"></i></div></div>
      </div>
      <div class="cf-pulse-chart">
        <div class="cf-pulse-row"><div><span>Reports</span><span>7 days</span></div><div class="cf-spark">${spark('reports')}</div></div>
        <div class="cf-pulse-row"><div><span>Resolved</span><span>7 days</span></div><div class="cf-spark">${spark('done')}</div></div>
        <div class="cf-pulse-row"><div><span>Escalated</span><span>7 days</span></div><div class="cf-spark">${spark('escs')}</div></div>
      </div>
      ${deptRows.length?`<div style="margin-top:18px"><div class="eyebrow">DEPARTMENT WORKLOAD</div><div class="cf-dept-bars">${deptRows.map(([name,n])=>`<div class="cf-dept-bar-row"><span>${cfEsc(name)}</span><div class="cf-dept-track"><i style="--value:${Math.round(n/maxDept*100)}%"></i></div><b>${n}</b></div>`).join('')}</div></div>`:''}
    </div>
  </section>`;
}

/* Add the analytics panel after the existing Admin intelligence layers. */
const cfAdminBeforeFinalAnalytics=admin;
admin=function(){return cfAdminBeforeFinalAnalytics()+cfAnalyticsOverview();};

/* Smooth view transitions without changing render behavior. */
const cfOriginalRenderForPolish=render;
render=function(){
  document.documentElement.classList.remove('cf-page-enter');
  cfOriginalRenderForPolish.apply(this,arguments);
  requestAnimationFrame(()=>document.documentElement.classList.add('cf-page-enter'));
};


boot();
